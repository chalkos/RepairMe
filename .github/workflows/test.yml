name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DALAMUD_HOME: ${{ github.workspace }}/dalamud
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud
        run: make fetch-dalamud

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Lint
        run: make lint

  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate workflow files
        run: make validate-workflows
